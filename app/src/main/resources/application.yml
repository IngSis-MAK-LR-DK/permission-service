spring:
  config:
    # Carga AUTH0_* desde el .env de la raiz del repo, si existe (ver .env.example).
    # Las variables de entorno con el mismo nombre ganan sobre el archivo.
    import: optional:file:.env[.properties]
  application:
    name: permission-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5434/permission}
    username: ${SPRING_DATASOURCE_USERNAME:permission}
    password: ${SPRING_DATASOURCE_PASSWORD:permission}
  security:
    oauth2:
      resourceserver:
        jwt:
          # El "iss" de Auth0 es "https://<tenant>/" (con esquema y barra final). Spring lo compara
          # como string exacto, asi que el formato tiene que coincidir.
          issuer-uri: https://${AUTH0_DOMAIN}/
          # Rechaza los tokens que no fueron emitidos para esta API (claim "aud"). Es UNA SOLA
          # API para toda la plataforma: todos los servicios validan la misma.
          audiences: ${AUTH0_AUDIENCE}
  jpa:
    hibernate:
      ddl-auto: validate

# Formato de los logs en la consola. Local: texto legible, con el requestId y el contexto de cada
# evento (%kvp). En el stack se prende JSON con LOGGING_STRUCTURED_FORMAT_CONSOLE=ecs (el contexto
# pasa a ser campos que se filtran: requestId, userId, snippetId...).
logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %5p [%X{requestId:-}] %logger{36} : %m %kvp%n"

trusted-service:
  # client_id de la app M2M del handler en Auth0 (la misma AUTH0_SERVICE_CLIENT_ID del handler). Solo
  # un token pedido por esa app puede registrar dueños (POST /permissions). No es un secreto, pero
  # no tiene valor por defecto: si falta, el servicio no arranca en vez de dejar el endpoint abierto.
  client-id: ${AUTH0_SERVICE_CLIENT_ID}
