# Construye la imagen Docker del servicio.
#  - En un pull request: solo la construye (detecta un Dockerfile roto antes de mergear).
#  - Al mergear a main: la construye y la publica en GitHub Container Registry.
name: Publish image

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/ingsis-mak-lr-dk/permission-service

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login en ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags: "latest" y "sha-<commit corto>". Tambien agrega las etiquetas OCI que enlazan la
      # imagen con este repositorio.
      - name: Calcular tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      # Para bajar el plugin de ci-kit hace falta login: se pasan como secretos de build
      # (no quedan guardados en la imagen).
      - name: Construir y publicar
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          secrets: |
            gpr_user=${{ github.actor }}
            gpr_key=${{ secrets.GITHUB_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
